<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECE 411</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1c1c1a;
      --muted: #5e5e58;
      --accent: #13294b;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --fg: #ececea;
        --muted: #a3a39c;
        --accent: #e84a27;
        --accent-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; letter-spacing: -0.01em; }
    p { color: var(--muted); margin: 0 0 2rem; }
    a.button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      text-decoration: none;
      font-weight: 600;
    }
    a.button:hover { filter: brightness(1.1); }
    a.button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to ECE 411</h1>
    <p>Computer Organization and Design at the University of Illinois.</p>
    <a class="button" href="ece-411-leaderboard/">Cache competition leaderboard</a>
  </main>
</body>
</html>
