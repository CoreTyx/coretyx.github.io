<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff sign-in</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1c1c1a; --muted: #5e5e58; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141413; --fg: #ececea; --muted: #a3a39c; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    p { color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <p id="status">Redirecting to staff sign-in…</p>
  <script>
    // backend.json is written by the server and names where sign-in lives.
    // GitHub sends staff back here after they approve the login; the query
    // (code and state) is passed straight on to finish signing in there.
    (async () => {
      const status = document.getElementById('status')
      try {
        const res = await fetch('backend.json?t=' + Date.now(), { cache: 'no-store' })
        const { ag } = await res.json()
        const base = new URL(ag)
        if (base.protocol !== 'https:') throw new Error('bad address')
        const params = new URLSearchParams(location.search)
        const returning = params.has('code') || params.has('error')
        const target = returning
          ? new URL('/api/auth/github/callback' + location.search, base)
          : new URL('/login', base)
        location.replace(target.href)
      } catch {
        status.textContent = 'Staff sign-in is unavailable right now. Try again in a minute.'
      }
    })()
  </script>
</body>
</html>
